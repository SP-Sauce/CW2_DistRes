<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DistRes v2 Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <h1>DistRes v2</h1>
    <p class="subtitle">Distributed Resource Access and Synchronisation Engine</p>

    <form method="post" action="/login">
      <label>Username</label>
      <input name="username" type="text" autocomplete="username" required>

      <label>Password</label>
      <input name="password" type="password" required>

      <button type="submit">Connect as client node</button>
    </form>

    <p id="error" class="error"></p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    if (error) document.getElementById("error").textContent = error;
  </script>
</body>
</html>
